<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE UNDERGROUND · 수사 본부</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140d08'/%3E%3Ccircle cx='27' cy='27' r='15' fill='none' stroke='%23d9a441' stroke-width='5'/%3E%3Cpath d='M38 38l13 13' stroke='%23d9a441' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='24' r='4' fill='%23f2c66b'/%3E%3Cpath d='M25 26h4l1.5 8h-7z' fill='%23f2c66b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;700&family=Nanum+Brush+Script&family=Noto+Serif+KR:wght@700;900&family=Special+Elite&family=VT323&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ug.css">
<style>
  :root{--bg:#0d0906;--panel:#18110c;--panel2:#211710;--line:#3d2d1f;--gold:#d9a441;--gold2:#f2c66b;--ink:#efe4d0;--mute:#9c8a71;--red:#c8463a;--green:#6fbf7a}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100dvh;background:
    radial-gradient(520px 380px at 88% 4%,rgba(255,188,104,.20),transparent 70%),
    radial-gradient(420px 300px at 6% 30%,rgba(255,170,90,.07),transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%,rgba(0,0,0,.95),transparent 60%),
    linear-gradient(180deg,#1a120c 0%,#0d0906 55%,#090604 100%);background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(255,220,180,.025) 0 1px,transparent 1px 30px),
    repeating-linear-gradient(90deg,rgba(255,220,180,.018) 0 1px,transparent 1px 64px)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  #app,#modal{position:relative;z-index:1}
  .serif,.caption{font-family:"Gowun Batang",serif}
  .caption{font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
  .room-no{font-family:"Gowun Batang",serif;font-weight:700;color:var(--gold);letter-spacing:.06em;font-size:28px;text-shadow:0 0 24px rgba(217,164,65,.35)}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
  .mono{font-family:"IBM Plex Mono",monospace}
  .panel{position:relative;background:linear-gradient(180deg,rgba(33,23,16,.94),rgba(22,15,10,.94));border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,170,.04)}
  .panel::before,.panel::after{content:"";position:absolute;width:16px;height:16px;border-color:rgba(217,164,65,.55);pointer-events:none}
  .panel::before{top:6px;left:6px;border-top:1.5px solid;border-left:1.5px solid}
  .panel::after{bottom:6px;right:6px;border-bottom:1.5px solid;border-right:1.5px solid}
  .gold{color:var(--gold)} .mute{color:var(--mute)}
  .btn{border-radius:8px;padding:14px 20px;font-weight:700;transition:transform .06s,filter .2s,opacity .2s;user-select:none;letter-spacing:.02em}
  .btn:active{transform:translateY(1px) scale(.985)} .btn:disabled{opacity:.35}
  .btn-gold{background:linear-gradient(180deg,#e9b955,#c48d2f);color:#1a1108;box-shadow:0 6px 18px rgba(217,164,65,.22),inset 0 1px 0 rgba(255,240,200,.5)}
  .btn-line{border:1px solid var(--line);background:rgba(36,26,18,.85);color:var(--ink)}
  .btn-red{background:linear-gradient(180deg,#d9564a,#a8352b);color:#fff;box-shadow:0 6px 18px rgba(200,70,58,.25)}
  .chip{border:1px solid var(--line);border-radius:6px;padding:12px 0;font-weight:700;font-size:22px;background:rgba(36,26,18,.85)}
  .chip.on{background:linear-gradient(180deg,#e9b955,#c48d2f);color:#1a1108;border-color:var(--gold)}
  input.txt{background:#120c08;border:1px solid var(--line);border-bottom:2px solid #5a432c;border-radius:4px;padding:14px;font-size:20px;color:var(--ink);width:100%}
  input.txt:focus{outline:none;border-bottom-color:var(--gold)}
  .fade{animation:fade .6s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .modal{position:fixed;inset:0;background:rgba(5,3,2,.78);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .timer-low{color:var(--red)!important;text-shadow:0 0 18px rgba(200,70,58,.5)}
  .tape{height:14px;border-radius:2px;background:repeating-linear-gradient(-45deg,#e3b13e 0 16px,#1a1209 16px 32px);box-shadow:0 2px 0 rgba(0,0,0,.4);opacity:.9}
  .stamp{display:inline-block;border:2px solid rgba(200,70,58,.75);color:rgba(220,90,78,.9);font-family:"IBM Plex Mono",monospace;font-weight:700;letter-spacing:.18em;padding:4px 10px;transform:rotate(-6deg);border-radius:3px;font-size:12px}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#e9dcc2;color:#2a1d12;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:12px;letter-spacing:.12em;padding:4px 10px 4px 14px;border-radius:2px;position:relative}
  .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#5a432c;position:absolute;left:5px}
  .lamp{position:absolute;right:18px;top:-6px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.22),transparent 65%);pointer-events:none}
  #pdisp{letter-spacing:.35em;font-size:30px;font-weight:700;min-height:60px;font-family:"IBM Plex Mono",monospace;color:#cdb98e;background:#070906;border:1px solid #2c2a22;border-radius:8px;padding:10px;text-align:center}
  .fx{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;animation:fxIn .15s ease both}
  .fx-box{font-family:"IBM Plex Mono",monospace;font-size:clamp(30px,7vw,72px);font-weight:700;letter-spacing:.18em;padding:16px 34px;border:4px solid currentColor;border-radius:6px;transform:rotate(-4deg);background:rgba(8,6,4,.72);animation:stampIn .38s cubic-bezier(.2,1.7,.4,1) both;text-shadow:0 0 22px currentColor}
  .fx-sub{margin-top:18px;font-family:"Gowun Batang",serif;font-size:clamp(16px,3vw,24px);color:#efe4d0;text-shadow:0 2px 12px #000;animation:fxIn .5s .25s ease both}
  .fx.ok{color:#7ee08f;background:radial-gradient(circle at 50% 50%,rgba(70,200,100,.22),rgba(0,0,0,.55) 70%)}
  .fx.bad{color:#ff6b5b;background:radial-gradient(circle at 50% 50%,rgba(220,50,40,.28),rgba(0,0,0,.55) 70%)}
  .fx.gold{color:#f2c66b;background:radial-gradient(circle at 50% 50%,rgba(242,198,107,.22),rgba(0,0,0,.6) 70%)}
  .fx.out{animation:fxOut .3s ease both}
  @keyframes fxIn{from{opacity:0}to{opacity:1}} @keyframes fxOut{to{opacity:0}}
  @keyframes stampIn{from{transform:scale(2.4) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
  .lcd{position:relative;overflow:hidden}
  .lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  .lcd::before{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(255,255,255,.05),transparent);animation:sweepY 3.6s linear infinite}
  @keyframes sweepY{to{top:110%}}
  .scan{position:relative;overflow:hidden}
  .scan .scanline{position:absolute;left:0;right:0;height:2px;top:0;background:linear-gradient(90deg,transparent,rgba(242,198,107,.9),transparent);box-shadow:0 0 14px rgba(242,198,107,.7);animation:sweepY2 2.8s ease-in-out infinite;pointer-events:none}
  @keyframes sweepY2{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
  .timer-low{animation:pulseR 1s ease-in-out infinite}
  @keyframes pulseR{50%{opacity:.55}}
  .sfx-btn{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--mute);margin-top:4px}
  .sfx-btn.on{color:var(--gold);border-color:rgba(217,164,65,.5)}
  .typing::after{content:"▌";color:var(--gold);animation:blink 1s steps(1) infinite}

  /* 푸터 */
  .ug-foot{margin-top:14px;text-align:center;font-size:11px;color:var(--mute);padding-bottom:4px}
  .foot-tape{height:6px;margin:0 auto 14px;max-width:420px;border-radius:2px;opacity:.45;background:repeating-linear-gradient(-45deg,#e3b13e 0 10px,#1a1209 10px 20px)}
  .foot-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:6px;font-size:11px;letter-spacing:.12em;color:#c9b48a}
  .foot-badge{border:1px solid rgba(200,70,58,.6);color:#e07a6e;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.25em;padding:2px 6px;border-radius:2px}
  .foot-seal{width:46px;height:46px;margin:0 auto 8px;border:2px solid rgba(200,70,58,.75);border-radius:6px;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px rgba(200,70,58,.25)}
  .seal-in{font-family:"Noto Serif KR",serif;font-weight:900;font-size:12px;line-height:1.05;color:#d0564a}
  .foot-subj{display:inline-flex;gap:4px;margin-left:6px}
  .foot-subj span{border:1px solid var(--line);border-radius:3px;padding:0 6px;font-size:10px;color:#c9b48a;background:rgba(36,26,18,.6)}
  .ug-foot p{margin:3px 0} .foot-mute{opacity:.7}
  /* ===== 최종 검거 연출 ===== */
  #show{position:fixed;inset:0;z-index:120;background:#050302;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}
  #show canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .siren{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .siren.r{background:radial-gradient(60% 80% at 0% 50%,rgba(255,40,40,.75),transparent 70%);animation:sr .5s steps(1) infinite}
  .siren.b{background:radial-gradient(60% 80% at 100% 50%,rgba(40,90,255,.75),transparent 70%);animation:sr .5s steps(1) infinite .25s}
  @keyframes sr{0%{opacity:1}50%{opacity:.08}}
  .siren.off{transition:opacity .8s;opacity:0!important;animation:none}
  .rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;pointer-events:none;opacity:0;transition:opacity 1s;
    background:repeating-conic-gradient(from 0deg,rgba(242,198,107,.16) 0 6deg,transparent 6deg 18deg);animation:spin 18s linear infinite;
    -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%)}
  .rays.on{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scan-txt{position:relative;font-family:"IBM Plex Mono",monospace;color:#7ee08f;font-size:clamp(15px,2.6vw,22px);letter-spacing:.12em;text-shadow:0 0 10px #7ee08f;min-height:1.6em;text-align:center}
  .perp{position:relative;margin-top:22px;width:min(360px,80vw);padding:22px 20px 18px;border-radius:10px;background:linear-gradient(180deg,#2a1f15,#17100a);border:2px solid #d9a441;box-shadow:0 0 50px rgba(217,164,65,.35);text-align:center;opacity:0}
  .perp.in{animation:perpIn .7s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes perpIn{0%{opacity:0;transform:scale(.2) rotate(-25deg)}100%{opacity:1;transform:none}}
  .perp .face{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f2c66b,#a8741c);display:flex;align-items:center;justify-content:center;font-family:"Gowun Batang",serif;font-size:52px;font-weight:700;color:#1a1108;box-shadow:0 0 0 4px #1a1108,0 0 0 6px #d9a441}
  .perp .who{font-family:"Gowun Batang",serif;font-size:26px;font-weight:700;color:#efe4d0} .perp .cn{color:#f2c66b;font-family:"IBM Plex Mono",monospace;letter-spacing:.2em;margin-top:2px}
  .perp .lk{color:#9c8a71;font-size:13px;margin-top:6px}
  .arrest{position:absolute;left:50%;top:46%;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:clamp(28px,6vw,54px);letter-spacing:.2em;color:#ff4a3a;border:5px solid #ff4a3a;padding:6px 18px;border-radius:6px;background:rgba(20,4,2,.35);text-shadow:0 0 18px rgba(255,74,58,.7);opacity:0;pointer-events:none;white-space:nowrap}
  .arrest.in{animation:slam .45s cubic-bezier(.3,1.8,.5,1) both}
  @keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) scale(3.2) rotate(-14deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-14deg)}}
  .shake2{animation:shake2 .45s}
  @keyframes shake2{0%,100%{transform:none}15%{transform:translate(-14px,8px)}30%{transform:translate(12px,-10px)}45%{transform:translate(-10px,-6px)}60%{transform:translate(8px,10px)}75%{transform:translate(-4px,4px)}}
  .closed{position:relative;margin-top:26px;font-family:"Gowun Batang",serif;font-weight:700;font-size:clamp(40px,9vw,96px);letter-spacing:.06em;color:#f2c66b;opacity:0;
    background:linear-gradient(100deg,#b07a1f 20%,#fff1c4 40%,#f2c66b 55%,#b07a1f 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(242,198,107,.55))}
  .closed.in{animation:closedIn .8s cubic-bezier(.2,1.5,.4,1) both,shine 2.2s linear .8s infinite}
  @keyframes closedIn{0%{opacity:0;transform:scale(.3);letter-spacing:.6em}100%{opacity:1;transform:none}}
  @keyframes shine{to{background-position:-150% 0}}
  .closed-sub{position:relative;color:#efe4d0;font-family:"Gowun Batang",serif;font-size:clamp(17px,3vw,26px);margin-top:8px;opacity:0;transition:opacity .6s}
  .closed-sub.in{opacity:1}
  .skip{position:absolute;right:16px;bottom:14px;font-size:12px;color:rgba(239,228,208,.45);font-family:"IBM Plex Mono",monospace;letter-spacing:.2em}
  .glitch{position:relative;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:clamp(40px,9vw,90px);color:#ff4a3a;letter-spacing:.12em;animation:glitch .35s steps(2) infinite;text-shadow:3px 0 #3af,-3px 0 #f33}
  @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-3px,2px) skewX(6deg)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,-2px) skewX(-4deg)}}
  .runner{position:absolute;bottom:18%;left:-120px;font-size:90px;filter:brightness(0) drop-shadow(0 0 6px rgba(255,74,58,.5));animation:run 2.4s linear forwards}
  @keyframes run{to{left:110%}}
  /* ===== 영화식 검거 연출 ===== */
  #show.cine{background:#000}
  .lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:20;transition:height .9s cubic-bezier(.6,0,.3,1)}
  .lb.t{top:0}.lb.b{bottom:0}#show.bars .lb{height:11vh}
  .grain{position:absolute;inset:-50%;z-index:19;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .5s steps(4) infinite}
  @keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
  .sub{position:absolute;left:0;right:0;bottom:14vh;z-index:21;text-align:center;font-family:"Noto Sans KR",sans-serif;font-size:clamp(15px,2.8vw,22px);color:#fff;text-shadow:0 2px 6px #000;min-height:1.5em;padding:0 20px}
  .sub .who{color:#f2c66b;margin-right:8px}
  .slate{position:absolute;top:13vh;left:0;right:0;z-index:21;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:clamp(11px,1.8vw,14px);letter-spacing:.35em;color:rgba(255,255,255,.75)}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s}
  .scene.on{opacity:1}
  .torch{position:absolute;inset:0;background:radial-gradient(circle 34vmin at var(--x,30%) 46%,transparent 0,rgba(0,0,0,.25) 40%,#000 75%);z-index:3;animation:torch 2.2s ease-in-out forwards}
  @keyframes torch{0%{--x:10%}100%{--x:50%}}
  @property --x{syntax:'<percentage>';inherits:false;initial-value:30%}
  #s1{background:radial-gradient(ellipse at 50% 55%,#7a6a55,#3a3128 60%,#15110d)}
  #s1::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 90px);z-index:1}
  .sil{position:relative;z-index:2;height:62vh;opacity:.97;filter:drop-shadow(0 0 30px rgba(0,0,0,.8))}
  .pl{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;z-index:4}
  .pl.r{background:linear-gradient(90deg,rgba(255,30,30,.55),transparent 45%);animation:sr .42s steps(1) infinite}
  .pl.b{background:linear-gradient(270deg,rgba(30,80,255,.55),transparent 45%);animation:sr .42s steps(1) infinite .21s}
  .mug{position:relative;width:min(560px,92vw);height:min(62vh,520px);background:#1b1d20;border:1px solid #333;overflow:hidden}
  .mug .chart{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 calc(6% - 1px),rgba(255,255,255,.28) calc(6% - 1px) 6%);background-position:0 1%}
  .mug .chart i{position:absolute;left:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:rgba(255,255,255,.6);font-style:normal}
  .mug .person-img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:72%;filter:grayscale(.35) contrast(1.1);-webkit-mask:linear-gradient(180deg,#000 80%,transparent);mask:linear-gradient(180deg,#000 80%,transparent)}
  .mug .person{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:88%}
  .mug .hline{position:absolute;left:0;right:0;border-top:2px dashed #ff5a46;}
  .mug .hline b{position:absolute;right:8px;top:-20px;color:#ff5a46;font-family:"IBM Plex Mono",monospace;font-size:13px}
  .placard{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);background:#0d0d0d;border:3px solid #ddd;color:#fff;font-family:"IBM Plex Mono",monospace;text-align:center;padding:8px 18px;min-width:230px;box-shadow:0 6px 18px #000}
  .placard .a{font-size:11px;letter-spacing:.25em;color:#bbb}.placard .b{font-size:22px;font-weight:700;letter-spacing:.12em}.placard .c{font-size:12px;color:#ccc;letter-spacing:.15em}
  .flashw{position:absolute;inset:0;background:#fff;opacity:0;z-index:15;pointer-events:none}
  .flashw.go{animation:fw .45s ease-out}
  @keyframes fw{0%{opacity:.95}100%{opacity:0}}
  .cuffs{width:min(460px,86vw);filter:drop-shadow(0 10px 18px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(200,210,220,.15));transform:translateY(-40vh) rotate(-30deg);opacity:0}
  .cuffs.in{animation:cuffIn .5s cubic-bezier(.3,1.4,.5,1) forwards}
  @keyframes cuffIn{to{transform:none;opacity:1}}
  .warrant-stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg) scale(3);opacity:0;border:6px double #e0453a;color:#e0453a;font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(28px,7vw,60px);padding:6px 22px;letter-spacing:.15em;background:rgba(10,0,0,.35);z-index:6;white-space:nowrap}
  .warrant-stamp.in{animation:wst .4s cubic-bezier(.3,1.8,.5,1) forwards}
  @keyframes wst{to{opacity:.95;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}
  .evid{width:min(520px,90vw);font-family:"Noto Sans KR",sans-serif}
  .evid h4{font-family:"IBM Plex Mono",monospace;letter-spacing:.35em;color:#f2c66b;font-size:13px;margin:0 0 12px;text-align:center}
  .ev{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.15);padding:10px 4px;color:#eee;font-size:clamp(15px,2.8vw,19px);opacity:0;transform:translateX(-30px)}
  .ev.in{transition:all .35s;opacity:1;transform:none}
  .ev b{font-family:"IBM Plex Mono",monospace;color:#7ee08f;font-size:13px;letter-spacing:.15em;border:1px solid #7ee08f;padding:1px 6px}

function header(sub) {
  const sc = S.team ? computeScore(S.team, S.events, S.config) : null;
  return `<div class="flex items-center justify-between mb-3 ug-hd">
    <button data-act="title" class="text-left"><div class="eyebrow">Project · 봉인된 금고와 그림자 도둑</div><div class="caption text-2xl sm:text-3xl" style="letter-spacing:.04em">THE UNDERGROUND</div></button>

}

/* ---------- 효과음 (Web Audio로 합성, 파일 없음) ---------- */
const SFX = (() => {
  let ctx = null, on = LS.local.getItem("ug_sfx") !== "0";
  const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ctx.state === "suspended") ctx.resume(); return ctx; };
  const tone = (f, d, type = "square", vol = .05, t0 = 0, f2) => { const c = ac(); if (!c || !on) return; const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .02); };
  const noise = (d, vol = .05, freq = 2000, t0 = 0, q = .8) => { const c = ac(); if (!c || !on) return; const t = c.currentTime + t0, len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len); const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q; g.gain.value = vol; src.connect(bp).connect(g).connect(c.destination); src.start(t); };
  return {
    get on() { return on; }, wake() { ac(); },
    toggle() { on = !on; LS.local.setItem("ug_sfx", on ? "1" : "0"); if (on) this.key(); },
    key() { tone(1900 + Math.random() * 300, .03, "square", .035); noise(.025, .06, 4200); },
    press(style, fn) {
      if (style === "type") { noise(.045, .2, fn ? 1400 : 2600, 0, 1.2); tone(fn ? 120 : 180, .035, "square", .045); if (!fn && S.kp && S.input[S.kpField] && S.kp.len && S.input[S.kpField].length === S.kp.len - 1) tone(2100, .5, "sine", .05, .12); }
      else if (style === "wood") { noise(.07, .25, fn ? 420 : 700, 0, 2.5); tone(fn ? 140 : 210, .06, "triangle", .07); }
      else if (style === "dial") { noise(.03, .14, 1800, 0, 1.6); tone(320, .025, "square", .03); }
      else if (style === "term") { noise(.03, .1, 3400, 0, 1); tone(fn ? 700 : 2400 + Math.random() * 300, .015, "square", .02); }

    at(2000, () => { scene("s1"); SFX.sirenLoop(3); SFX.radioClick(); say("무전", "본부, 용의자 확인. 지금 진입한다."); });
    at(3500, () => { SFX.heart(); say("수사관", "움직이지 마십시오. 경찰입니다."); });
    // 3. 머그샷
    at(4800, () => { scene("s2"); $("slate").textContent = "IDENTIFICATION · 신원 확인"; say("", `코드명 ${F.code} · 신장 ${F.h}`); flash(); });
    at(5400, flash); at(5900, flash);
    // 4. 수갑 · 영장
    at(6700, () => { scene("s3"); say("수사관", "당신을 금고 침입 혐의로 체포합니다."); $("cuffs").classList.add("in"); });
    at(7150, () => { SFX.cuffs(); el.classList.add("shake2"); });
    at(7700, () => { $("wst").classList.add("in"); SFX.stamp(); SFX.boom(); });
    // 5. 증거 대조
    at(8900, () => { scene("s4"); $("slate").textContent = ""; say("", "수사관들이 모은 증거가 모두 일치했다."); el.querySelectorAll(".ev").forEach((e, i) => at(250 + i * 320, () => { e.classList.add("in"); SFX.lock(); })); });
    // 6. 사건 종결
    at(11600, () => { scene("s5"); $("sub").innerHTML = ""; SFX.braam(); setTimeout(() => $("cc") && $("cc").classList.add("in"), 50); });
    at(15200, finish);
  });
}
function escapeShow() {
  return new Promise(resolve => {
    const el = document.createElement("div"); el.id = "show";
    el.innerHTML = `<div class="siren r"></div><div class="glitch">CASE OPEN</div><div class="closed-sub in" style="margin-top:14px">범인이 어둠 속으로 사라졌습니다…</div><div class="runner">🏃</div><div class="skip">TAP TO SKIP</div>`;
    document.body.appendChild(el); SFX.wrong(); SFX.windDown(); setTimeout(() => SFX.footsteps(), 500);
    const close = () => { el.style.transition = "opacity .6s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 600); };
    let done = false; const finish = () => { if (done) return; done = true; resolve(close); };
    el.addEventListener("click", finish); setTimeout(() => el.querySelector(".siren").classList.add("off"), 1200); setTimeout(finish, 3600);
  });
}
async function tryFinal() {
  const v = S.input.final || ""; if (!v) return;
  S.busy = true;
  const ok = (await hashCode("final", v)) === S.config.finalHash;
  S.anim = true;                                   // 연출 중에는 화면을 다시 그리지 않음
  S.input.final = "";
  // 결과를 먼저 저장 → 연출 도중 새로고침해도 결과가 유지됨
  const p = await DB.tx("teams/" + S.teamId, cur => {
    if (!cur.finalUnlocked || cur.finalResult || (cur.finalTries || 0) >= 2) return null;
    const tries = (cur.finalTries || 0) + 1;
    return { finalTries: tries, finalResult: ok ? "success" : (tries >= 2 ? "fail" : ""), finalAt: DB.TS };
  });
  if (p && !ok) await DB.add(`teams/${S.teamId}/events`, { teamId: S.teamId, type: "wrong", room: "final", main: true, at: DB.TS });
  await scrambleTo(v, false, 1600);
  let close = null;
  if (ok) { S.justFinished = true; close = await arrestShow(); }
  else if (p && p.finalResult === "fail") { S.justFinished = true; close = await escapeShow(); }
  else { SFX.wrong(); await fx("bad", "WRONG LOCKER", "마지막 기회가 남았습니다", 1100); }
  if (p && !ok) S.msg = p.finalResult ? "" : `<span style="color:var(--red)">틀렸습니다. 마지막 기회입니다! (-2점)</span>`;
  S.anim = false; S.busy = false; render();
  if (close) close();                              // 결과 화면을 그린 뒤 연출을 걷어냄
}
function renderResult() {
  const t = S.team, sc = computeScore(t, S.events, S.config);
  const ok = t.finalResult === "success";
  const medal = { "수석 탐정": "🥇", "정예 탐정": "🥈", "수습 탐정": "🥉" }[sc.grade];
  const F = SUSPECTS[5];
  const fresh = S.justFinished; S.justFinished = false;
  $app.innerHTML = `<div class="fade">${header()}
  <div class="panel res-stage p-6 sm:p-10 text-center mb-4">
    <div style="position:relative">
    <div class="tape mb-6"></div>
    ${ok ? `<div class="eyebrow mb-2">Case Closed · 수사 종결 보고서</div><div class="caption text-4xl mb-6">그림자 도둑 검거</div>
      <div class="inline-block text-left rounded-xl p-5 mb-6 relative pop" style="background:#241b13;border:2px solid var(--gold);animation-delay:.5s">
        <span class="stamp-mini">ARRESTED</span>
        <div class="flex items-center gap-3 mb-2"><img src="${SUSPECT_IMG[F.k]}" alt="" style="width:64px;height:78px;object-fit:cover;border-radius:4px;border:2px solid var(--gold);filter:grayscale(.3)"><div><div class="font-bold text-lg">${F.role}</div><div class="gold">${F.code}</div></div></div>
        <div class="text-sm mute">사물함 ${F.locker} · ${esc(F.wear)} · ${esc(F.pen)}</div></div>`
      : `<div class="eyebrow mb-2" style="color:var(--red)">Case Open</div><div class="caption text-4xl mb-6">범인을 놓쳤습니다</div>`}
    <div><div class="rank-seal ${ok ? "" : "fail"} ${fresh ? "slam" : ""}"><small>CASE 1926-14</small><b>${sc.grade}</b><small>${ok ? "검거 완료" : "수사 미결"}</small></div></div>
    <div class="text-xl mb-4">총점 <b id="cnt" class="mono" style="font-size:28px;color:var(--gold2)">0</b> / 700</div>
    <p class="mute">모든 모둠의 수사가 끝나면, 선생님과 함께 <b class="gold">최종 범인 영상</b>을 봅니다.</p></div>
  </div>
  <div class="panel p-5"><div class="grid grid-cols-3 sm:grid-cols-7 gap-2 text-center text-sm">
    ${S.team.route.map((r, i) => `<div class="rounded-lg p-2 pop" style="background:#241b13;animation-delay:${1.2 + i * .12}s"><div class="mute">${ROOM_NAMES[r]}</div><div class="font-bold">${sc.rooms[r].score ?? "-"}</div></div>`).join("")}
    <div class="rounded-lg p-2 pop" style="background:#241b13;animation-delay:1.95s"><div class="mute">최종</div><div class="font-bold">${sc.finalScore}${sc.fail ? " (-150)" : ""}</div></div></div></div>
  ${disclaimer}</div>`;
  const el = document.getElementById("cnt"), target = sc.total, t0 = performance.now(), dur = 1600;
  const step = now => { const k = Math.min(1, (now - t0 - 600) / dur); if (k > 0) el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else el.textContent = target; };
  requestAnimationFrame(step);
  if (ok && fresh) setTimeout(() => SFX.stamp(), 900);
}

/* ---------- 교사 PIN (제목 터치) ---------- */
function teacherPin() {
  S.input.pin = "";
  const draw = () => {
    const v = S.input.pin || "";
    $modal.innerHTML = `<div class="modal"><div class="panel p-6 max-w-sm w-full fade">
      <div class="font-bold mb-3">교사 화면</div>
      <div id="pdisp" class="disp text-center rounded-xl py-3 mb-2" style="background:#0e0a07;border:1px solid var(--line)">${"●".repeat(v.length) || "<span class='mute' style='letter-spacing:0;font-size:18px'>PIN</span>"}</div>
      <div id="pmsg" class="text-center text-sm h-5 mb-2" style="color:var(--red)"></div>
      <div class="grid grid-cols-3 gap-2">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="key" data-act="pkey" data-v="${n}">${n}</button>`).join("")}<button class="key" data-act="closeModal">✕</button><button class="key" data-act="pkey" data-v="0">0</button><button class="key" data-act="pgo">→</button></div></div></div>`;
  };
  S.drawPin = draw; draw();
}

function turnDial(i, dlt) {
  const f = S.kpField, kp = S.kp; if (!f || !kp) return;
  const arr = (S.input[f] || "0".repeat(kp.len)).split(""); arr[i] = String(((+arr[i] || 0) + dlt + 10) % 10); S.input[f] = arr.join("");
  SFX.press("dial"); S.msg = ""; setDisp(S.input[f]);
}
let dialY = null, dialI = -1;
document.addEventListener("pointerdown", e => { const w = e.target.closest(".wheel"); if (w && !e.target.closest("button")) { dialY = e.clientY; dialI = +w.dataset.i; } });
document.addEventListener("pointerup", e => { if (dialY != null && Math.abs(e.clientY - dialY) > 16) turnDial(dialI, e.clientY < dialY ? 1 : -1); dialY = null; });
function saveInput() { try { LS.local.setItem("ug_input", JSON.stringify({ input: Object.fromEntries(Object.entries(S.input).filter(([k]) => k.includes(":"))), lockUntil: S.lockUntil || 0 })); } catch (e) {} }
function setDisp(text, ph) {
  saveInput();
  const d = document.getElementById("disp"); if (!d) return render();
  d.classList.remove("shake"); d.innerHTML = dispHTML(text, Object.assign({}, S.kp, ph ? { ph } : {}));
  const m = document.getElementById("cmsg"); if (m && !S.msg) m.innerHTML = "";
}
/* ---------- 이벤트 ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  SFX.wake();
  const st = (S.kp && S.kp.style) || "pad";
  if (["key", "ukey", "fkey"].includes(a)) SFX.press(st); else if (a === "pkey") SFX.press("pad"); else if (["back", "clear", "uback", "uclear", "fback", "fclear"].includes(a)) SFX.press(st, true);
  if (a === "dial") { turnDial(+b.dataset.i, +b.dataset.d); return; }
  if (a === "closeModal") { if (e.target === b || b.tagName === "BUTTON") { $modal.innerHTML = ""; render(); } return; }
  if (a === "openCase") return openCase();
  if (a === "goTeacher" || a === "goBoard") {   // 숨은 입구: 푸터 '가정'·'기술'을 빠르게 2번 눌러야 이동 (실수 방지)
    const now = Date.now(); if (S.dblKey === a && now - (S.dblAt || 0) < 600) { S.dblKey = ""; location.href = a === "goTeacher" ? "teacher.html" : "board.html"; return; }
    S.dblKey = a; S.dblAt = now; return; }
  if (a === "unmute") { const v = document.getElementById("introVid"); if (v) { v.muted = false; v.play().catch(() => {}); } b.remove(); return; }
  if (a === "title") { const now = Date.now(); S.tap5 = (now - (S.tapAt || 0) < 700) ? (S.tap5 || 0) + 1 : 1; S.tapAt = now; if (S.tap5 >= 5) { S.tap5 = 0; quickReset(); } return; }   // 제목 5번 → 이 태블릿 빠른 초기화
  if (a === "sfx") { SFX.toggle(); return render(); }
  if (a === "pkey") { if ((S.input.pin || "").length < 8) S.input.pin = (S.input.pin || "") + v; const pd = document.getElementById("pdisp"); if (pd) pd.textContent = "●".repeat(S.input.pin.length); return; }
  if (a === "pgo") { if ((await hashCode("pin", S.input.pin)) === PIN_HASH) { location.href = "teacher.html"; } else { S.input.pin = ""; S.drawPin(); document.getElementById("pmsg").textContent = "PIN이 다릅니다"; } return; }
  if (a === "cls") { S.login.cls = +v; S.login.leader = document.getElementById("leader").value; S.login.members = document.getElementById("members").value; return render(); }
  if (a === "grp") { S.login.group = +v; S.login.leader = document.getElementById("leader").value; S.login.members = document.getElementById("members").value; return render(); }
  if (a === "login") return doLogin();
  if (a === "vsecret") { const now = Date.now(); S.vt = (now - (S.vtAt || 0) < 700) ? (S.vt || 0) + 1 : 1; S.vtAt = now;   // 교사용: 제목 5번 → 건너뛰기 허용
    if (S.vt >= 5) { S.vt = 0; S.vSkip = true; const bt = document.getElementById("vdone"); if (bt) { bt.disabled = false; bt.textContent = "교사 확인 · 영상 건너뛰기"; } } return; }
  if (a === "videoDone") { const bt = document.getElementById("vdone"); if (bt && bt.disabled) return; }
  if (a === "videoDone") return DB.update("teams/" + S.teamId, { stage: "popup" });
  if (a === "popupOk") { $modal.innerHTML = ""; return DB.update("teams/" + S.teamId, { stage: "rooms" }); }
  if (a === "start") { SFX.start(); fx("gold", "MISSION START", `${ROOM_NAMES[curRoom()]} · 15:00`, 1000); return startRoom(); }
  if (a === "suspects") return showSuspects();
  if (a === "arrive") { S.msg = ""; return DB.tx("teams/" + S.teamId, cur => { const r = cur.route[cur.roundIdx]; return (cur.rooms[r] && cur.rooms[r].delivered && cur.roundIdx < 5) ? { roundIdx: cur.roundIdx + 1 } : null; }); }
  if (a === "toWarrant") return DB.update("teams/" + S.teamId, { stage: "warrant" });
  // 방 코드 키패드
  const r = S.team && S.team.stage === "rooms" ? curRoom() : 0;
  const rc = r ? S.config.rooms[r] : null;
  const act = rc ? (rc.codes.find(c => !c.main && !((roomState(r).subs || {})[c.id])) || rc.codes.find(c => c.main)) : null;
  const k = act ? r + ":" + act.id : "";
  const maxLen = act ? (act.len || 12) : 12;
  if (a === "sw" && k) { const arr = (S.input[k] || "0".repeat(maxLen)).split(""); const i = +b.dataset.i; arr[i] = arr[i] === "1" ? "0" : "1"; S.input[k] = arr.join(""); S.msg = "";
    const on = arr[i] === "1"; saveInput(); b.classList.toggle("on", on); b.querySelector("i").textContent = on ? "1" : "0"; SFX.toggleSw(on);
    const brk = b.closest(".brk"); if (brk) { brk.classList.remove("jolt", "ok"); void brk.offsetWidth; brk.classList.add("jolt"); }
    const m = document.getElementById("cmsg"); if (m) m.innerHTML = ""; if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {} return; }
  if (a === "key" && act && act.type === "order") { if ((S.input[k] || "").includes(v)) return; S.msg = ""; if ((S.input[k] || "").length < maxLen) S.input[k] = (S.input[k] || "") + v; b.disabled = true; SFX.paper(); return setDisp(S.input[k]); }
  if ((a === "back" || a === "clear") && act && act.type === "order") { S.input[k] = a === "back" ? (S.input[k] || "").slice(0, -1) : ""; saveInput(); return render(); }
  if (a === "clear" && act && act.ui && ROOM_UI[act.ui] && ROOM_UI[act.ui].style === "switch") { S.input[k] = "0".repeat(maxLen);
    document.querySelectorAll(".sw.on").forEach((x, j) => setTimeout(() => { x.classList.remove("on"); x.querySelector("i").textContent = "0"; SFX.toggleSw(false); }, j * 90)); return; }
  if (a === "key") { S.msg = ""; if ((S.input[k] || "").length < maxLen) S.input[k] = (S.input[k] || "") + v; return setDisp(S.input[k].toUpperCase(), "코드를 입력하세요"); }
  if (a === "back") { S.input[k] = (S.input[k] || "").slice(0, -1); return setDisp(S.input[k].toUpperCase(), "코드를 입력하세요"); }
  if (a === "clear") { S.input[k] = ""; return setDisp("", "코드를 입력하세요"); }
  if (a === "gotEnvelope") { const rr = curRoom(); if (!(await askYes(last6() ? "증거 봉투와 극비 파일 봉투를 받았나요?" : "선생님께 증거 봉투를 받았나요?"))) return;
    return DB.update("teams/" + S.teamId, { [`rooms.${rr}.delivered`]: true }); }
  if (a === "demoDeliver") { const rr = curRoom(); await DB.update(`requests/${S.teamId}_${rr}`, { status: "done" }).catch(() => {}); return DB.update("teams/" + S.teamId, { [`rooms.${rr}.delivered`]: true }); }
  if (a === "submit") return submitCode(b.dataset.code);
  if (a === "hint") return openHint(+b.dataset.m, +b.dataset.l);
  if (a === "hintYes") return confirmHint(+b.dataset.m, +b.dataset.l);
  // 교사 확인 코드
  if (a === "ukey") { if ((S.input.unlock || "").length < 8) S.input.unlock = (S.input.unlock || "") + v; return setDisp(S.input.unlock, "확인 코드"); }
  if (a === "uback") { S.input.unlock = (S.input.unlock || "").slice(0, -1); return setDisp(S.input.unlock, "확인 코드"); }
  if (a === "uclear") { S.input.unlock = ""; return setDisp("", "확인 코드"); }
  if (a === "eye") { S.eyeUntil = Date.now() + 3000; return render(); }
  if (a === "unlock") return tryUnlock();
  if (a === "fkey") { S.msg = ""; if ((S.input.final || "").length < 4) S.input.final = (S.input.final || "") + v; return setDisp(S.input.final, "4자리"); }
  if (a === "fback") { S.input.final = (S.input.final || "").slice(0, -1); return setDisp(S.input.final, "4자리"); }
  if (a === "fclear") { S.input.final = ""; return setDisp("", "4자리"); }
  if (a === "final") return tryFinal();
});

/* ---------- 구독 ---------- */
function attachTeam() {
  S.unsub.forEach(f => f()); S.unsub = [];
  if (!S.teamId) return;
  S.unsub.push(DB.watchDoc("teams/" + S.teamId, d => {
    if (!d) { LS.local.removeItem("ug_team"); LS.local.removeItem("ug_input"); S.input = {}; S.team = null; S.teamId = ""; S.events = []; S.unsub.forEach(f => f()); S.unsub = []; return render(); }
    const prevStage = S.team && S.team.stage;
    if (S.team && d.route && S.team.roundIdx === d.roundIdx) { const r0 = d.route[d.roundIdx], a0 = (S.team.rooms || {})[r0] || {}, b0 = (d.rooms || {})[r0] || {}; if (!a0.delivered && b0.delivered) SFX.stamp(); }
    S.team = d; if (prevStage === "popup" && d.stage !== "popup") $modal.innerHTML = "";
    if (S.team.stage !== "popup" || !$modal.innerHTML) render();
  }));
  S.unsub.push(DB.watchCol(`teams/${S.teamId}/events`, evs => { S.events = evs; if (S.team && !$modal.innerHTML) render(); }));
}
(async () => {
  $app.innerHTML = `<div class="text-center mute p-10">접속 중…</div>`;
  try { S.mode = await DB.init(); } catch (e) { $app.innerHTML = `<div class="panel p-8 text-center">서버에 연결하지 못했어요. 새로고침해 주세요.<div class="text-xs mute mt-2">${esc(e.message)}</div></div>`; return; }
  DB.watchDoc("config/main", c => { S.config = mergeConfig(c); if (S.team && !$modal.innerHTML) render(); });
  if (S.teamId) attachTeam(); else render();
})();

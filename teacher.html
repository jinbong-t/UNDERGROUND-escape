<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE UNDERGROUND · 교사 대시보드</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140d08'/%3E%3Ccircle cx='27' cy='27' r='15' fill='none' stroke='%23d9a441' stroke-width='5'/%3E%3Cpath d='M38 38l13 13' stroke='%23d9a441' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='24' r='4' fill='%23f2c66b'/%3E%3Cpath d='M25 26h4l1.5 8h-7z' fill='%23f2c66b'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ug.css">
<style>
  :root{--bg:#120d09;--panel:#1d1610;--line:#3a2c1f;--gold:#d9a441;--ink:#f3e9d8;--mute:#a8957a;--red:#c8463a;--green:#5fae6b}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif}
  .serif{font-family:"Gowun Batang",serif}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .gold{color:var(--gold)} .mute{color:var(--mute)}
  .btn{border-radius:10px;padding:8px 14px;font-weight:700;user-select:none}
  .btn:disabled{opacity:.35}
  .btn-gold{background:var(--gold);color:#1a1209} .btn-line{border:1px solid var(--line);background:#241b13;color:var(--ink)} .btn-red{background:var(--red);color:#fff}
  .tab{padding:10px 16px;border-bottom:2px solid transparent;font-weight:700;color:var(--mute)} .tab.on{color:var(--gold);border-color:var(--gold)}
  table{border-collapse:collapse;width:100%} th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
  th{color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap}
  input,select,textarea{background:#241b13;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
  .pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
  .req{animation:pulse 1.4s infinite} @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,164,65,.5)}50%{box-shadow:0 0 0 6px rgba(217,164,65,0)}}
  .end-ov{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
  .end-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0d0906;border-bottom:1px solid #3a2c1f}
  .end-t{font-family:"IBM Plex Mono",monospace;letter-spacing:.25em;font-size:12px;color:#d9a441}
  .end-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
  .end-stage video,.end-stage iframe{width:100%;height:100%;object-fit:contain;border:0;background:#000}
  .end-close{text-align:center;color:#efe4d0}
  .end-stamp{display:inline-flex;flex-direction:column;align-items:center;font-family:"Noto Serif KR",serif;font-weight:900;font-size:72px;color:#e0453a;border:8px double #e0453a;padding:6px 36px;transform:rotate(-6deg);animation:eStamp .5s cubic-bezier(.2,1.6,.4,1)}
  .end-stamp small{font-family:"Special Elite",monospace;font-size:18px;letter-spacing:.4em}
  @keyframes eStamp{from{opacity:0;transform:rotate(-6deg) scale(2.4)}}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
</style>
</head>
<body>
<div id="app" class="max-w-7xl mx-auto p-4"></div>
<div id="modal"></div>
<footer style="text-align:center;font-size:12px;color:#9c8a71;padding:20px 16px 28px;border-top:1px solid #3a2c1f;margin-top:24px"><div style="letter-spacing:.1em;color:#c9b48a">WS교수학습법연구회 합동수사본부 · 국어 · 영어 · 과학 · 기술 · 가정 · 역사</div><div style="margin-top:3px">여섯 교과 선생님들이 함께 만든 수사 본부 교사 대시보드 · PROJECT: THE UNDERGROUND</div><div id="verTag" style="margin-top:3px;font-family:monospace;font-size:10px;letter-spacing:.15em;opacity:.7"></div></footer>
<script src="common.js"></script>
<script type="module">


/* ================= 교사 대시보드 ================= */
const T = { ok: LS.session.getItem("ug_pin_ok") === "1", tab: "live", teams: [], events: [], reqs: [], config: mergeConfig(null), rawConfig: null,
  cls: 0, room: 0, day: todayKey(), pin: "", edit: null, tick: null, lastReqCount: 0 };
const $app = document.getElementById("app"), $modal = document.getElementById("modal");
const evOf = id => T.events.filter(e => e.teamId === id);
const remain = t => { const r = t.route[t.roundIdx], rs = (t.rooms || {})[r] || {}; if (rs.status !== "running" || !rs.startAt) return null; return (rs.startAt + (ROOM_SEC + Number(rs.adjust || 0)) * 1000 - DB.now()) / 1000; };
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const finalState = t => t.finalResult === "success" ? ["성공", "var(--green)"] : t.finalResult === "fail" ? ["검거 실패", "var(--red)"] : t.finalUnlocked ? [`입력 가능 · 남은 ${2 - (t.finalTries || 0)}회`, "var(--gold)"] : t.stage === "warrant" ? ["교사 확인 대기", "var(--mute)"] : ["-", "var(--mute)"];
const roomStatusText = t => { const r = t.route[t.roundIdx], rs = (t.rooms || {})[r] || {};
  if (t.stage === "video") return "영상 시청"; if (t.stage === "popup") return "안내 팝업"; if (t.stage === "warrant") return "체포 영장";
  if (!rs.status) return `${ROOM_NAMES[r]} · 시작 전`; if (rs.status === "running") return `${ROOM_NAMES[r]} · 진행 중`;
  if (!rs.delivered) return `${ROOM_NAMES[r]} · 봉투 대기`; return `${ROOM_NAMES[r]} → 이동 중`; };

function render() {
  clearInterval(T.tick);
  if (!T.ok) return renderPin();
  const delivered = q => { const tm = T.teams.find(x => x.id === q.teamId); return !tm || ((tm.rooms || {})[q.room] || {}).delivered; };
  const openReqs = T.reqs.filter(q => q.status === "open" && !delivered(q) && (!T.room || q.room === T.room) && (!T.cls || q.cls === T.cls)).sort((a, b) => (a.at || 0) - (b.at || 0));
  $app.innerHTML = `
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div><div class="text-xs gold tracking-[.3em]">TEACHER DASHBOARD</div><div class="serif text-2xl">THE UNDERGROUND</div></div>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      ${T.adminErr ? `<span class="pill" style="background:#4a1d18;color:#f0a097" title="${esc(T.adminErr)}">교사 권한 오류</span>` : ""}
      ${DB.live ? `<span class="pill" style="background:#20351f;color:#9fd3a5">Firebase 연결</span>` : `<span class="pill" style="background:#3a2c1f;color:var(--gold)">체험 모드</span>`}
      <select data-f="day">${[...new Set([todayKey(), ...T.teams.map(t => t.day)])].filter(Boolean).sort().map(d => `<option value="${d}" ${T.day === d ? "selected" : ""}>${d.slice(0, 2)}/${d.slice(2)}</option>`).join("")}<option value="" ${!T.day ? "selected" : ""}>전체 날짜</option></select>
      <select data-f="cls"><option value="0">전체 반</option>${[1, 2, 3, 4].map(c => `<option value="${c}" ${T.cls === c ? "selected" : ""}>${c}반</option>`).join("")}</select>
      <select data-f="room"><option value="0">전체 방</option>${[1, 2, 3, 4, 5, 6].map(r => `<option value="${r}" ${T.room === r ? "selected" : ""}>${ROOM_NAMES[r]}</option>`).join("")}</select>
    </div>
  </div>
  <div class="flex gap-1 mb-4 border-b" style="border-color:var(--line)">
    ${[["live", "실시간 현황"], ["result", "결과·내보내기"], ["settings", "설정"]].map(([k, n]) => `<button class="tab ${T.tab === k ? "on" : ""}" data-act="tab" data-v="${k}">${n}</button>`).join("")}
  </div>
  ${T.tab === "live" ? `
    <div class="panel p-4 mb-4">
      <div class="flex items-center justify-between mb-2"><div class="font-bold">증거 봉투 요청 <span class="gold">${openReqs.length}</span></div><span class="text-xs mute">정답(또는 시간 초과) 모둠이 생기면 여기에 뜹니다</span></div>
      <div class="flex flex-wrap gap-2">${openReqs.length ? openReqs.map(q => `<div class="req rounded-xl px-4 py-3 flex items-center gap-3" style="background:#2a2017;border:1px solid var(--gold)">
        <div><div class="font-bold">${ROOM_NAMES[q.room]} · ${q.cls}반 ${q.group}모둠</div><div class="text-xs mute">${esc(q.leader)} · ${q.solved ? "정답" : "미해결"}${q.last ? " · <b class='gold'>+극비 파일</b>" : ""}</div></div>
        <button class="btn btn-gold" data-act="deliver" data-id="${q.id}">전달 완료</button></div>`).join("") : `<div class="mute text-sm">대기 중인 요청이 없습니다.</div>`}</div>
    </div>
    ${classDone()}
    <div class="panel overflow-x-auto"><table>
      <thead><tr><th>반·모둠</th><th>팀장 / 팀원</th><th>현재</th><th>남은 시간</th><th>방 결과</th><th>힌트</th><th>오답</th><th>점수</th><th>최종 코드</th><th></th></tr></thead>
      <tbody>${teamsView().map(t => { const sc = computeScore(t, evOf(t.id), T.config); const rm = remain(t); const [fs, fc] = finalState(t);
        return `<tr><td class="font-bold whitespace-nowrap">${t.cls}반 ${t.group}모둠</td><td><div>${esc(t.leader)}</div><div class="text-xs mute">${esc(t.members)}</div></td>
        <td class="whitespace-nowrap">${roomStatusText(t)}<div class="text-xs mute">ROUND ${t.roundIdx + 1}/6</div></td>
        <td class="tabular-nums font-bold" data-timer="${t.id}" style="${rm != null && rm <= 60 ? "color:var(--red)" : ""}">${rm == null ? "-" : fmt(rm)}</td>
        <td class="whitespace-nowrap">해결 ${sc.done - sc.unsolved}${sc.unsolved ? ` <span class="pill" style="background:#3b1d19;color:#f0b4ac">미해결 ${sc.unsolved}</span>` : ""}<div class="text-xs mute">${sc.done}/6 방 종료</div></td>
        <td>${sc.hints}</td><td>${sc.wrongs}</td><td class="font-bold gold">${sc.sum + sc.finalScore - (sc.fail ? 150 : 0) + Number(t.scoreAdjust || 0)}</td>
        <td><span style="color:${fc}" class="text-sm font-semibold">${fs}</span></td>
        <td><button class="btn btn-line text-xs" data-act="manage" data-id="${t.id}">관리</button></td></tr>`; }).join("") || `<tr><td colspan="10" class="mute text-center py-8">등록된 모둠이 없습니다.</td></tr>`}</tbody></table></div>
    <div class="mt-4 panel p-4"><div class="flex flex-wrap items-center gap-2"><b class="gold mr-2">교실 현황판 원격 조정</b>
      ${[["standby", "대기"], ["intro", "오프닝 영상"], ["status", "현황판"], ["notice", "공지"], ["rank", "순위 발표"], ["ending", "엔딩"]].map(([k, l]) => `<button class="btn btn-line" style="padding:8px 12px" data-act="board" data-v="${k}">${l}</button>`).join("")}
      <input id="bnotice" class="flex-1" style="min-width:180px" placeholder="공지 문구 (공지 버튼과 함께 전송)">
      <a class="btn btn-line" style="padding:8px 12px" href="board.html" target="_blank">현황판 열기 ↗</a></div>
      <div class="text-xs mute mt-2">교실 TV/전자칠판에서 board.html을 열어 두면, 여기서 누른 화면으로 바로 바뀝니다. (위에서 고른 반이 현황판에 표시됩니다)</div></div>
    <div class="mt-4 flex justify-end gap-2"><button class="btn btn-line" data-act="intro">인트로 영상 재생</button><button class="btn btn-line" data-act="ending">최종 범인 영상 재생</button></div>`
  : T.tab === "result" ? renderResult() : renderSettings()}
  `;
  T.tick = setInterval(() => { document.querySelectorAll("[data-timer]").forEach(el => { const t = T.teams.find(x => x.id === el.dataset.timer); const rm = t && remain(t); el.textContent = rm == null ? "-" : fmt(rm); el.style.color = rm != null && rm <= 60 ? "var(--red)" : ""; }); }, 1000);
}
function teamsView() {
  return T.teams.filter(t => (!T.day || t.day === T.day) && (!T.cls || t.cls === T.cls) && (!T.room || (t.stage === "rooms" && t.route[t.roundIdx] === T.room)))
    .sort((a, b) => a.cls - b.cls || a.group - b.group);
}
function classDone() {
  const out = [1, 2, 3, 4].map(c => { const ts = T.teams.filter(t => t.cls === c && (!T.day || t.day === T.day)); if (!ts.length) return ""; const d = ts.filter(t => t.finalResult).length;
    return `<span class="pill" style="${d === ts.length ? "background:#20351f;color:#9fd3a5" : "background:#2a2017;color:var(--mute)"}">${c}반 최종 입력 ${d}/${ts.length}${d === ts.length ? " · 엔딩 영상 OK" : ""}</span>`; }).join(" ");
  return out.trim() ? `<div class="mb-3 flex flex-wrap gap-2">${out}</div>` : "";
}

/* ---------- 결과 ---------- */
function renderResult() {
  const rows = teamsView().map(t => ({ t, sc: computeScore(t, evOf(t.id), T.config) }));
  return `<div class="panel overflow-x-auto mb-4"><table><thead><tr><th>반·모둠</th><th>팀장</th>${[1, 2, 3, 4, 5, 6].map(r => `<th>${ROOM_NAMES[r]}</th>`).join("")}<th>최종</th><th>조정</th><th>총점</th><th>등급</th></tr></thead>
  <tbody>${rows.map(({ t, sc }) => `<tr><td>${t.cls}반 ${t.group}모둠</td><td>${esc(t.leader)}</td>${[1, 2, 3, 4, 5, 6].map(r => `<td>${sc.rooms[r].score ?? "-"}${sc.rooms[r].status === "timeout" ? "<span class='text-xs mute'> 미해결</span>" : ""}</td>`).join("")}
  <td>${t.finalResult ? sc.finalScore + (sc.fail ? " (-150)" : "") : "-"}</td><td>${Number(t.scoreAdjust || 0) || ""}</td><td class="font-bold gold">${sc.total}</td><td>${sc.grade || "-"}</td></tr>`).join("") || `<tr><td colspan="12" class="mute text-center py-8">기록이 없습니다.</td></tr>`}</tbody></table></div>
  <button class="btn btn-gold" data-act="csv">CSV 내보내기</button> <button class="btn btn-line" data-act="csvCopy">결과 복사</button> <span id="csvMsg" class="text-sm mute"></span>
  <div class="panel p-4 mt-6" style="border-color:rgba(200,70,58,.5)"><div class="font-bold mb-1" style="color:#f0a097">기록 초기화</div>
    <p class="text-sm mute mb-3">모둠 기록(진행·점수·힌트·오답·증거 요청)을 지웁니다. 정답·힌트·로테이션 <b>설정은 지워지지 않습니다.</b> 지우기 전에 CSV를 먼저 저장해 두세요.</p>
    <div class="text-sm mb-2">반별 삭제 <span class="mute">${T.day ? `(${T.day.slice(0, 2)}/${T.day.slice(2)} 기록만 · 위에서 날짜를 '전체 날짜'로 바꾸면 모든 날짜)` : "(모든 날짜)"}</span></div>
    <div class="flex flex-wrap gap-2 mb-4">${[1, 2, 3, 4].map(c => { const n = T.teams.filter(t => t.cls === c && (!T.day || t.day === T.day)).length;
      return `<button class="btn btn-line" style="padding:10px 16px" data-act="wipe" data-v="cls:${c}" ${n ? "" : "disabled"}>${c}반 삭제 <span class="mute text-sm">(${n}모둠)</span></button>`; }).join("")}</div>
    <button class="btn btn-red" data-act="wipe" data-v="all">전체 기록 초기화 <span class="text-sm" style="opacity:.8">(모든 날짜·모든 반 ${T.teams.length}모둠)</span></button>
    <div id="wipeMsg" class="text-sm mt-2 mute">${T.wipeMsg || ""}</div></div>`;
}
function exportCsv(copyOnly) {
  const head = ["날짜", "반", "모둠", "팀장", "팀원", ...[1, 2, 3, 4, 5, 6].map(r => ROOM_NAMES[r]), "최종", "검거실패", "조정", "총점", "등급", "힌트수", "오답수"];
  const lines = [head].concat(teamsView().map(t => { const sc = computeScore(t, evOf(t.id), T.config);
    return [t.day, t.cls, t.group, t.leader, t.members, ...[1, 2, 3, 4, 5, 6].map(r => sc.rooms[r].score ?? ""), t.finalResult ? sc.finalScore : "", sc.fail ? "Y" : "", t.scoreAdjust || 0, sc.total, sc.grade, sc.hints, sc.wrongs]; }));
  const csv = "﻿" + lines.map(l => l.map(x => `"${String(x ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `underground_결과_${T.day || "전체"}.csv`; a.click();
}

/* ---------- 확인 대화상자 (confirm 대체) ---------- */
function uiConfirm(text) {
  return new Promise(res => {
    const box = document.createElement("div"); box.className = "modal"; box.style.zIndex = 60;
    box.innerHTML = `<div class="panel p-6 max-w-sm w-full"><p class="mb-5">${esc(text)}</p><div class="flex gap-2"><button class="btn btn-line flex-1" data-c="0">취소</button><button class="btn btn-red flex-1" data-c="1">확인</button></div></div>`;
    box.addEventListener("click", e => { const c = e.target.closest("[data-c]"); if (!c) return; e.stopPropagation(); box.remove(); res(c.dataset.c === "1"); });
    document.body.appendChild(box);
  });
}
/* ---------- 관리 모달 ---------- */
function manage(id) {
  const t = T.teams.find(x => x.id === id); if (!t) return;
  const r = t.route[t.roundIdx];
  $modal.innerHTML = `<div class="modal"><div class="panel p-6 max-w-lg w-full">
    <div class="flex justify-between items-start mb-4"><div><div class="font-bold text-lg">${t.cls}반 ${t.group}모둠 · ${esc(t.leader)}</div><div class="text-xs mute">${t.route.map((x, i) => `${i === t.roundIdx ? "<b class='gold'>" : ""}${ROOM_NAMES[x]}${i === t.roundIdx ? "</b>" : ""}`).join(" → ")}</div></div><button class="btn btn-line" data-act="close">닫기</button></div>
    <div class="space-y-4 text-sm">
      <div><div class="mute mb-1">점수 조정 (현재 ${t.scoreAdjust || 0})</div><div class="flex gap-2"><input id="adj" type="number" class="w-28" value="0"><button class="btn btn-line" data-act="adjScore" data-id="${id}">적용</button></div></div>
      <div><div class="mute mb-1">시간 보정 · ${ROOM_NAMES[r]} (분, +는 연장)</div><div class="flex gap-2"><input id="tadj" type="number" class="w-28" value="1"><button class="btn btn-line" data-act="adjTime" data-id="${id}">적용</button></div></div>
      <div><div class="mute mb-1">진행 방 수동 변경</div><div class="flex gap-2"><select id="round">${t.route.map((x, i) => `<option value="${i}" ${i === t.roundIdx ? "selected" : ""}>ROUND ${i + 1} · ${ROOM_NAMES[x]}</option>`).join("")}</select><button class="btn btn-line" data-act="setRound" data-id="${id}">이동</button></div>
        <div class="text-xs mute mt-1">이동한 방이 '시작 전'이 되도록 그 방 기록은 유지됩니다.</div></div>
      <div><div class="mute mb-1">멈춘 모둠 진행시키기 · 지금 ${ROOM_NAMES[r]}</div><div class="flex flex-wrap gap-2"><button class="btn btn-gold" data-act="pushNext" data-id="${id}">${t.roundIdx >= 5 ? "체포 영장 단계로 보내기" : "다음 방으로 보내기"}</button><button class="btn btn-line" data-act="toHome" data-id="${id}">처음 화면으로 (등록 해제)</button></div>

async function wipe(scope) {
  const cls = scope.startsWith("cls:") ? +scope.slice(4) : 0;
  const list = scope === "all" ? T.teams.slice() : T.teams.filter(t => (!T.day || t.day === T.day) && t.cls === cls);
  if (!list.length) { document.getElementById("wipeMsg").textContent = "지울 기록이 없습니다."; return; }
  const what = scope === "all" ? `전체 ${list.length}개 모둠` : `${T.day ? T.day.slice(0, 2) + "/" + T.day.slice(2) + " " : ""}${cls}반 ${list.length}개 모둠`;
  if (!(await uiConfirm(`${what}의 기록을 모두 지울까요? 되돌릴 수 없습니다.`))) return;
  if (!(await uiConfirm("정말 지울까요? (CSV를 저장해 두셨나요?)"))) return;
  const msg = document.getElementById("wipeMsg"); let n = 0, fail = 0, lastErr = "";
  const del = p => DB.del(p).catch(e => { fail++; lastErr = (e && (e.code || e.message)) || String(e); });
  for (const tm of list) {
    msg.textContent = `삭제 중… ${++n}/${list.length}`;
    let evs = []; try { evs = await DB.listCol(`teams/${tm.id}/events`); } catch (e) { fail++; lastErr = e.code || e.message; }
    for (const e of evs) await del(`teams/${tm.id}/events/${e.id}`);
    for (const q of T.reqs.filter(q => q.teamId === tm.id)) await del("requests/" + q.id);
    await del("teams/" + tm.id);
  }
  if (scope === "all") for (const q of T.reqs) await del("requests/" + q.id);
  T.wipeMsg = fail ? `<span style="color:var(--red)">일부를 지우지 못했습니다 (${fail}건 · ${esc(lastErr)}). 교사 PIN으로 다시 들어온 뒤 시도해 주세요.</span>`
    : `<span style="color:var(--green)">${what}의 기록을 지웠습니다.</span>`;
  if (fail && /permission/i.test(lastErr)) { await becomeAdmin(); }
  render();
}
async function pushNext(id) {
  const t = T.teams.find(x => x.id === id); if (!t) return;
  const r = t.route[t.roundIdx], rs = (t.rooms || {})[r] || {};
  if (!(await uiConfirm(`${t.cls}반 ${t.group}모둠을 ${t.roundIdx >= 5 ? "체포 영장 단계로" : ROOM_NAMES[t.route[t.roundIdx + 1]] + "(으)로"} 보낼까요?${rs.status === "solved" || rs.status === "timeout" ? "" : ` ${ROOM_NAMES[r]}은 미해결(50점)로 처리됩니다.`}`))) return;
  try {
    const patch = { [`rooms.${r}.delivered`]: true };
    if (rs.status !== "solved" && rs.status !== "timeout") { patch[`rooms.${r}.status`] = "timeout"; patch[`rooms.${r}.endAt`] = DB.TS; await DB.create(`teams/${id}/events/timeout_${r}`, { teamId: id, type: "timeout", room: r, at: DB.TS }); }
    if (t.roundIdx >= 5) patch.stage = "warrant"; else { patch.roundIdx = t.roundIdx + 1; patch.stage = "rooms"; }
    await DB.update("teams/" + id, patch);
    const q = T.reqs.find(x => x.teamId === id && x.room === r); if (q) await DB.update("requests/" + q.id, { status: "done", doneAt: DB.TS }).catch(() => {});
    $modal.innerHTML = ""; render();
  } catch (e) { alertErr(e); }
}
async function toHome(id) {
  const t = T.teams.find(x => x.id === id); if (!t) return;

}

  if (a === "saveCfg") return saveSettings();
  if (a === "resetCfg") { if (await uiConfirm("설정 화면을 기본값으로 되돌릴까요? (저장을 눌러야 반영)")) { T.edit = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); render(); } return; }
  if (a === "addCode") { readSettingsForm(); T.edit.rooms[b.dataset.room].codes.unshift({ id: "c" + Date.now().toString(36), label: "중간 코드", main: false, len: 4, hash: "", okMsg: "확인! 다음 단서를 찾으세요." }); return render(); }
  if (a === "delCode") { readSettingsForm(); T.edit.rooms[b.dataset.room].codes.splice(+b.dataset.code, 1); return render(); }
  if (a === "addMis") { readSettingsForm(); T.edit.rooms[b.dataset.room].missions.push({ name: "새 미션", h1: "", h2: "" }); return render(); }
  if (a === "delMis") { readSettingsForm(); T.edit.rooms[b.dataset.room].missions.splice(+b.dataset.mis, 1); return render(); }
});
document.addEventListener("change", e => { const f = e.target.dataset.f; if (!f) return; if (f === "day") T.day = e.target.value; else T[f] = Number(e.target.value); render(); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pin") enterPin(e.target.value); });

function beep() { try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(c.currentTime + .15); } catch (e) {} }
const safeRender = () => { if (T.tab === "settings" || $modal.innerHTML) return; render(); };
function start() {
  render();
  DB.watchCol("teams", ts => { T.teams = ts; safeRender(); });
  DB.watchGroup("events", evs => { T.events = evs; safeRender(); });
  DB.watchCol("requests", qs => { const n = qs.filter(q => q.status === "open").length; if (n > T.lastReqCount) beep(); T.lastReqCount = n; T.reqs = qs; safeRender(); });
  DB.watchDoc("config/main", c => { T.rawConfig = c; T.config = mergeConfig(c); if (T.tab !== "settings") safeRender(); });
}
(async () => {
  const vt = document.getElementById("verTag"); if (vt) vt.textContent = APP_VER;
  $app.innerHTML = `<div class="text-center mute p-10">접속 중…</div>`;
  await DB.init();
  if (T.ok) { await becomeAdmin(); start(); } else render();
})();
</script>
</body>
